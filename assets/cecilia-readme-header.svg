<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Cecilia Luna — Full Stack Developer</title>
  <desc id="desc">Portfolio-inspired GitHub README hero in ivory, burgundy, coral and red.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E000C"/>
      <stop offset="55%" stop-color="#7C0B2B"/>
      <stop offset="100%" stop-color="#D10000"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FB4B4E" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FB4B4E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3E000C" flood-opacity=".35"/>
    </filter>
    <style>
      .serif { font-family: Lora, Georgia, serif; }
      .script { font-family: Caveat, "Comic Sans MS", cursive; }
      .caps { font-family: Lora, Georgia, serif; letter-spacing: 3.5px; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="34" fill="url(#glow)"/>

  <!-- Decorative strokes -->
  <path d="M70 78 C160 20, 245 20, 326 72" fill="none" stroke="#FFCBDD" stroke-opacity=".75" stroke-width="3"/>
  <path d="M890 336 C970 375, 1070 368, 1138 319" fill="none" stroke="#FB4B4E" stroke-opacity=".85" stroke-width="4"/>
  <circle cx="1060" cy="88" r="48" fill="none" stroke="#FFCBDD" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="1120" cy="135" r="12" fill="#FFCBDD" fill-opacity=".7"/>

  <g filter="url(#shadow)">
    <rect x="74" y="108" width="1052" height="228" rx="24" fill="#FBF9F4" fill-opacity=".96"/>
  </g>

  <text x="118" y="166" class="caps" font-size="18" fill="#7C0B2B">CECILIA LUNA · SOFTWARE DEVELOPER</text>
  <text x="118" y="238" class="serif" font-size="47" font-weight="700" fill="#201A1E">Frontend · Full Stack · UX/UI · AI</text>
  <text x="118" y="290" class="script" font-size="38" fill="#D10000">build with purpose · learn continuously · have a laugh</text>
</svg>